# What to look for on Wikimedia Commons, subject by subject (BIBLE.md, "Media").
#
#   id    the file ids' stem: <id> for one file, <id>-1 … <id>-n for several
#   q     the search words
#   n     how many files (default 1)
#   type  image (default) | video | audio | pdf | svg | png | gif
#   as    what to publish them as, one per file or one for all: jpg webp avif png
#         for pictures, mp4 webm mov for videos, mp3 ogg wav flac m4a for recordings
#   qi    pictures only: look among Commons' Quality images first (default true)
#   x     more search terms, as Commons' search takes them
#   for   what in the archive they are for (a hint for the authors)

